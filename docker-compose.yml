version: '3.8'

services:
  nginx:
    image: nginx:1.25
    container_name: attendance_nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./docker/php
    container_name: attendance_php
    volumes:
      - ./src:/var/www
    expose:
      - "9000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: attendance_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: attendance_pma
    environment:
      PMA_HOST: mysql
      PMA_USER: laravel
      PMA_PASSWORD: laravel
    ports:
      - "8080:80"
    depends_on:
      - mysql

  mailhog:
    image: mailhog/mailhog
    container_name: attendance_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
